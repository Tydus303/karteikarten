 y="149" font-size="17" font-weight="800" fill="#22313d" text-anchor="start">100 %</text><circle cx="110" cy="250" r="34" fill="#f9c846"/><text x="160" y="256" font-size="16" font-weight="700" fill="#22313d" text-anchor="start">Sonne</text><rect x="250" y="232" width="216" height="40" rx="8" fill="#f39a2b"/><text x="476" y="259" font-size="17" font-weight="800" fill="#b8681a" text-anchor="start">ca. 45 %</text><text x="410" y="350" font-size="15" font-weight="600" fill="#22313d" text-anchor="middle">Die Sonne ist viel größer – aber fast 400-mal weiter weg als der Mond.</text><text x="410" y="374" font-size="15" font-weight="600" fill="#22313d" text-anchor="middle">Deshalb wirkt sie nur knapp halb so stark.</text></g></svg>
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karteikasten</title>
<meta name="description" content="Karteikarten mit Leitner-System für die Berufsschule">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Karteikasten">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--surface2:#ecebe5;--text:#1d1f22;--muted:#6b6f76;--border:#e1ded6;
  --accent:#2f5d7c;--accent-contrast:#ffffff;--good:#2e7d4f;--bad:#b4443a;
  --b1:#c8574c;--b2:#d98e47;--b3:#c9ad45;--b4:#7fae5a;--b5:#3f8f5f;
  --shadow:0 10px 30px rgba(20,25,30,.08),0 2px 6px rgba(20,25,30,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417;--surface:#1b1e22;--surface2:#262a30;--text:#ecebe6;--muted:#9aa0a8;--border:#2f343a;
    --accent:#86b4d3;--accent-contrast:#0c1923;--good:#5fbf88;--bad:#e27b70;
    --shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417;--surface:#1b1e22;--surface2:#262a30;--text:#ecebe6;--muted:#9aa0a8;--border:#2f343a;
  --accent:#86b4d3;--accent-contrast:#0c1923;--good:#5fbf88;--bad:#e27b70;
  --shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-text-size-adjust:100%}
body.learning{overflow:hidden;overscroll-behavior:none}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px)}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:0 0 12px}
.small{font-size:14px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;gap:6px;min-height:52px;margin:0 -6px 10px}
.topbar h1{font-size:30px;flex:1;letter-spacing:-.02em;padding-left:6px}
@media (max-width:380px){.topbar h1{font-size:25px}}
.topbar h2{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{background:var(--surface2)}
.icon-btn.on{background:var(--accent);color:var(--accent-contrast)}
.icon-btn svg{width:24px;height:24px}
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;padding:12px 18px;border-radius:14px;cursor:pointer;min-height:50px;text-decoration:none}
.btn svg{width:20px;height:20px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.danger{color:var(--bad)}
.btn+.btn.block{margin-top:10px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
.panel-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.deck-item{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.deck-item:hover{border-color:var(--muted)}
.deck-name{flex:1;font-size:19px;font-weight:650}
.pill{font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.due{background:var(--accent);color:var(--accent-contrast)}
.boxbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2);margin-top:12px}
.boxbar span{display:block;height:100%}
.b1{background:var(--b1)}.b2{background:var(--b2)}.b3{background:var(--b3)}.b4{background:var(--b4)}.b5{background:var(--b5)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.boxcol{text-align:center}
.boxcol .col{height:84px;background:var(--surface2);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}
.boxcol .fill{width:100%;border-radius:10px 10px 0 0;transition:height .4s}
.boxcol .num{font-size:20px;font-weight:700;margin-top:6px}
.boxcol .lbl{font-size:12px;color:var(--muted)}
.legend{margin-top:12px;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:8px 4px;border-radius:10px;cursor:pointer;min-height:44px;line-height:1.2}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg-caption{font-size:14px;color:var(--muted);margin:-4px 0 14px 4px}
.install-video{display:block;width:100%;max-width:320px;margin:4px auto 10px;border-radius:16px;background:#000;aspect-ratio:9/16}
.intro .install-video{max-height:58dvh;width:auto;max-width:100%}
.install-banner{display:flex;align-items:center;gap:12px}
.install-banner .grow{flex:1}
.hint{font-size:14px;color:var(--muted);margin-top:10px;text-align:center}
.disclaimer{font-size:12px;line-height:1.45;color:var(--muted);text-align:center;margin:22px 8px 6px}
.section-head{margin:22px 0 10px}
.section-head h3{flex:1;font-size:19px}
.exam{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--border);padding:11px 2px;cursor:pointer}
.exam:first-of-type{border-top:0}
.exam-date{min-width:62px;font-weight:700;font-variant-numeric:tabular-nums}
.exam-date small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.exam-name{flex:1;font-weight:600}
.pill.soon{background:var(--bad);color:#fff}
.exams-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.exams-head .panel-title{margin:0}
:root{--cal-red:#ff3b30}
.cal-year{color:var(--cal-red);font-size:15px;font-weight:600;margin:2px 4px 0}
.cal-head{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.cal-month{flex:1;font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 4px}
.cal-nav{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--cal-red);font-size:26px;line-height:1;cursor:pointer}
.cal-nav:hover{background:var(--surface2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0 8px}
.cal-day{background:none;border:0;border-top:1px solid var(--border);font:inherit;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;min-height:58px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal-day.empty{cursor:default}
.cal-day .n{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:18px;font-variant-numeric:tabular-nums}
.cal-day.we .n{color:var(--muted)}
.cal-day.today .n{color:var(--cal-red);font-weight:700}
.cal-day.sel .n{background:var(--text);color:var(--bg);font-weight:700}
.cal-day.sel.today .n{background:var(--cal-red);color:#fff}
.cal-dots{display:flex;gap:3px;height:6px;margin-top:4px}
.cal-dots i{width:6px;height:6px;border-radius:50%}
.cal-daytitle{font-size:15px;font-weight:700;margin:18px 4px 6px;color:var(--muted)}
.cal-ev{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cal-ev .bar{width:4px;border-radius:2px;flex:none}
.cal-ev .t{flex:1}
.cal-ev .t b{display:block;font-size:17px}
.cal-ev .t span{font-size:14px;color:var(--muted)}
.cal-ev .when{align-self:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--text)}
.cal-none{color:var(--muted);font-size:15px;padding:6px 4px 10px}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer}
.list-item:hover{border-color:var(--muted)}
.li-text{flex:1;min-width:0}
.li-front{font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li-back{font-weight:650;margin-top:2px}
.boxdot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
input:not([type=checkbox]),textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 6px}
label.check{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--text);font-size:15px;margin:12px 0}
label.check input{width:20px;height:20px;accent-color:var(--accent)}
.search{margin-bottom:10px}
pre.prompt{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);border-radius:12px;padding:12px;margin:0 0 12px}
ul.info{margin:0;padding-left:20px}
ul.info li{margin:4px 0}

/* Lernen */
.learn{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 38px);min-height:480px}
.lp{flex:1;padding:0 8px}
.lp-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.lp-bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .35s}
.lp-text{font-size:14px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0 18px;min-height:0}
.card{position:relative;width:100%;height:100%;max-height:480px;perspective:1600px;-webkit-perspective:1600px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;will-change:transform}
.card-inner{position:absolute;inset:0;transition:transform .6s cubic-bezier(.2,.75,.25,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 26px 40px;text-align:center}
.face.front{transform:rotateY(0deg)}
.face.back{transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:18px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tag .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tap-hint{position:absolute;bottom:16px;left:0;right:0;font-size:13px;color:var(--muted)}
.front-text{font-size:26px;line-height:1.38;font-weight:500;text-wrap:balance}
.front-text.m{font-size:22px}.front-text.s{font-size:19px}
.term{font-size:36px;font-weight:750;line-height:1.18;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.term.m{font-size:29px}.term.s{font-size:24px}
.card-img{display:block;width:100%;max-height:30vh;min-height:0;flex:0 1 auto;object-fit:contain;margin-top:14px;border-radius:12px;cursor:zoom-in}
.img-hint{font-size:12px;color:var(--muted);margin-top:4px}
.face:has(.card-img) #cb{width:100%}
.face:has(.card-img) .example{margin-top:10px;font-size:15px}
.speak{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;margin-left:10px;vertical-align:middle;border-radius:50%;border:1px solid var(--border);background:var(--surface2);font-size:19px;line-height:1;cursor:pointer;padding:0}
.en-term{margin-top:10px;font-size:17px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}.en-term b{color:var(--text)}
.zoom-img{display:block;width:100%;height:auto;border-radius:14px}
.example{margin-top:22px;font-size:17px;line-height:1.45;color:var(--muted);max-width:30em}
.example b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.swipe-hint{position:absolute;top:18px;z-index:3;font-weight:800;font-size:14px;letter-spacing:.06em;padding:6px 12px;border-radius:10px;border:2.5px solid currentColor;background:var(--surface);opacity:0;pointer-events:none}
.hint-good{right:18px;color:var(--good);transform:rotate(8deg)}
.hint-bad{left:18px;color:var(--bad);transform:rotate(-8deg)}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:12px;transition:opacity .25s}
.rate.off{opacity:.3;pointer-events:none}
.rate button{min-height:66px;border-radius:18px;font:inherit;font-size:18px;font-weight:700;border:2px solid;cursor:pointer;background:var(--surface)}
.rate .r-bad{color:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.rate .r-good{color:var(--good);border-color:var(--good);background:color-mix(in srgb,var(--good) 11%,var(--surface))}
.rate button:active{transform:scale(.98)}
.kbd-hint{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
@media (hover:none){.kbd-hint{display:none}}
/* Schreib-Modus */
.hidden{display:none!important}
.learn.write .card{max-height:340px}
.answer{display:flex;gap:10px}
.answer input{flex:1;min-width:0;font-size:18px;min-height:56px;border-radius:16px}
.answer .btn{min-height:56px;border-radius:16px;flex:none}
.verdict{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700}
.verdict:empty{display:none}
.verdict .v-text{flex:1}
.verdict .btn{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.your-answer{margin-top:18px;font-size:16px;color:var(--muted)}
.your-answer b{color:var(--text)}
.your-answer.ok b{color:var(--good)}
.your-answer.no b{color:var(--bad);text-decoration:line-through}
/* Auswahl-Modus */
.learn.mc .card{max-height:320px}
.mc{display:flex;flex-direction:column;gap:8px}
.mc button{font:inherit;font-size:16px;line-height:1.3;text-align:left;padding:12px 14px;min-height:52px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;gap:10px;align-items:center}
.mc button .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:700;display:grid;place-items:center}
.mc button:disabled{cursor:default;opacity:.55}
.mc button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface));opacity:1}
.mc button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));opacity:1}
.mc .mc-next{justify-content:center;font-weight:700;background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}
/* Serie & Statistik */
.streak{display:flex;align-items:center;gap:14px;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.streak .flame{font-size:30px;line-height:1}
.streak .sn{font-size:22px;font-weight:800;line-height:1.1}
.streak .grow{flex:1;min-width:0}
.goalbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.goalbar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.goalbar.done span{background:var(--good)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat-grid b{display:block;font-size:26px;font-weight:800;line-height:1.15}
.stat-grid span{font-size:13px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:4px;height:120px;position:relative;margin-top:6px}
.chart .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart .bar i{display:block;background:var(--surface2);border-radius:4px 4px 0 0;min-height:2px}
.chart .bar.hit i{background:var(--good)}
.chart .bar.part i{background:var(--accent)}
.chart .goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.chart-lbl{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:4px}
.chart-lbl span{flex:1;text-align:center}
.deck-stat{margin:12px 0 0}.deck-stat:first-of-type{margin-top:0}

/* Auswertung */
.score{text-align:center;padding:24px 16px}
.score .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.score .msg{font-size:18px;font-weight:600;margin-top:8px}
.score-row{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;gap:8px}
.score-row b{display:block;font-size:26px}
.score-row span{font-size:13px;color:var(--muted)}
.t-good{color:var(--good)}.t-bad{color:var(--bad)}

/* Sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,12,15,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;background:var(--surface);border-radius:22px 22px 0 0;padding:22px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:92dvh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-size:20px;margin-bottom:4px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1 1 40%}
.menu{display:flex;flex-direction:column;margin:12px 0 14px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.menu button{font:inherit;text-align:left;padding:15px 16px;border:0;border-bottom:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:var(--surface2)}
.menu button.danger{color:var(--bad)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.card-inner{transition-duration:.01s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- Grundlagen ---------- */
const KEY = 'karteikasten.v1';
const DAY = 86400000;
const INTERVAL = [0, 1, 2, 4, 7, 14]; // Tage bis zur nächsten Abfrage je Fach
const $ = s => document.querySelector(s);

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function makeCard(o) {

    box: Math.min(5, Math.max(1, parseInt(o.box) || 1)), due: Number(o.due) || 0, wrong: Number(o.wrong) || 0 };
}
function makeDeck(name, cards) { return { id: uid(), name: name.trim(), cards: cards.map(makeCard) }; }

    back: pick(c, ['back','rueckseite','rückseite','begriff','fachbegriff','antwort','answer','term']),
    example: pick(c, ['example','beispiel']), img: pick(c, ['img','image','bild']) || undefined, de: Array.isArray(c.de) ? c.de : undefined,
    box: c.box, due: c.due, wrong: c.wrong

function parseImport(text) {
  text = String(text || '').trim();
  const s = text.search(/[\[{]/), e = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
  if (s < 0 || e < s) throw new Error('Kein JSON gefunden');
  const data = JSON.parse(text.slice(s, e + 1));
  let decks;
  if (Array.isArray(data)) decks = (data.length && (data[0].cards || data[0].karten)) ? data : [{ name: '', cards: data }];
  else if (data.decks || data.stapel) decks = data.decks || data.stapel;
  else if (data.cards || data.karten) decks = [data];

  return decks.map(d => ({
    name: String(d.name || d.titel || d.title || '').trim(), archived: !!d.archived,
    cards: (d.cards || d.karten || []).map(normCard).filter(c => c && c.front && c.back)

function importDecks(list) {
  const key = c => (c.front + '|' + c.back).toLowerCase().replace(/\s+/g, ' ').trim();
  let added = 0, skipped = 0, newDecks = 0;
  list.forEach(src => {
    const name = src.name || ('Import ' + new Date().toLocaleDateString('de-DE'));
    let d = db.decks.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!d) { d = makeDeck(name, []); if (src.archived) d.archived = true; db.decks.push(d); newDecks++; }
    const seen = new Set(d.cards.map(key));
    src.cards.forEach(c => {
      if (seen.has(key(c))) { skipped++; return; }

const GOALS = [10, 20, 30, 50];
const goal = () => db.settings.dailyGoal || 20;
const dayKey = (t = new Date()) => ymd(t);
const dayEntry = k => db.log[k] || { n: 0, r: 0 };
const hit = k => { const e = db.log[k]; return !!e && e.n >= (e.g || goal()); };
function mergeLog(a, b) {
  const out = Object.assign({}, a || {});
  if (b && typeof b === 'object') for (const [k, v] of Object.entries(b)) {
    if (!v || typeof v.n !== 'number') continue;
    const x = out[k]; out[k] = !x || v.n > x.n ? v : x;
  }
  return out;
}
function logAnswer(known) {
  const k = dayKey(), e = db.log[k] || (db.log[k] = { n: 0, r: 0 });
  const before = hit(k);
  e.n++; if (known) e.r++;
  if (!e.g) e.g = goal();

}
function streakNow() {
  const d = new Date(); d.setHours(12, 0, 0, 0);
  if (!hit(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (hit(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }

}
function streakBest() {
  const keys = Object.keys(db.log).filter(hit).sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys) {
    const t = new Date(k + 'T12:00:00').getTime();
    run = prev && Math.round((t - prev) / DAY) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = t;
  }

}

let S = null;
function startSession(d, ids, dir, mode) {
  if (document.activeElement) document.activeElement.blur();
  S = { deckId: d.id, lang: d.cards.some(c => c.de) ? (d.lang || 'en') : 'en', en: /englisch|english/i.test(d.name), dir, mode, write: mode === 'write', mc: mode === 'mc', checked: false, verdict: false, queue: shuffle(ids.slice()), total: ids.length, first: new Map(), done: 0, current: null, flipped: false, revealed: false, busy: true };
  ui.view = 'learn'; render(); showNext();
}
const sizeCls = (t, m, s) => t.length > s ? 's' : t.length > m ? 'm' : '';
function showNext() {
  if (!S) return;
  const d = deck(S.deckId);
  while (S.queue.length && !d.cards.some(c => c.id === S.queue[0])) S.queue.shift();
  if (!S.queue.length) { finishSession(); return; }
  const c = d.cards.find(x => x.id === S.queue[0]);
  S.current = c; S.flipped = false; S.revealed = false;
  const card = $('#card'), inner = card.querySelector('.card-inner');
  inner.style.transition = 'none'; card.classList.remove('flipped');
  const de = S.lang === 'de' && c.de, F = cardF(c), B = cardB(c), E = de ? c.de[2] : c.example;
  const spk = S.en ? `<button type="button" class="speak" data-say="${esc(c.back)}" aria-label="Aussprache anhören" title="Aussprache anhören">🔊</button>` : '';
  const ex = E ? `<div class="example"><b>Beispiel</b>${esc(E)}</div>` : '';
  const term = `<div class="term ${sizeCls(B, 18, 30)}">${esc(B)}${de ? '' : spk}</div>`;
  const desc = `<div class="front-text ${sizeCls(F, 70, 130)}">${esc(F)}</div>`;
  const enLine = de ? `<div class="en-term">EN: <b>${esc(c.back)}</b>${spk}</div>` : '';
  $('#cf').innerHTML = S.dir === 'normal' ? desc : term;
  const pic = c.img ? `<img class="card-img" src="${esc(c.img)}" alt="Bild zur Lösung" draggable="false"><div class="img-hint">🔍 Bild antippen zum Vergrößern</div>` : '';
  $('#cb').innerHTML = (S.dir === 'normal' ? term : desc) + enLine + pic + ex;
  const again = S.first.has(c.id);
  const tag = `<span class="dot b${c.box}"></span>Fach ${c.box}${again ? ' · Wiederholung' : ''}`;
  $('#tag-f').innerHTML = tag; $('#tag-b').innerHTML = tag;
  setHints(0);
  card.style.transition = 'none'; card.style.transform = 'translateY(18px) scale(.96)'; card.style.opacity = '0';
  void card.offsetWidth;
  inner.style.transition = '';
  card.style.transition = 'transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s';
  card.style.transform = ''; card.style.opacity = '';
  $('#rate').classList.add('off');

    ans.focus({ preventScroll: true });
  }
  if (S.mc) { S.checked = false; renderMc(d, c); }
  updateProgress();
  S.busy = false;
}

/* Antwort prüfen (Schreib-Modus) */
const normA = s => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
  .replace(/[^a-z0-9& ]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^(der|die|das|ein|eine) /, '');
function variants(term) {
  const v = new Set([term, ...term.split(/\s+\/\s+/)]), m = term.match(/^(.*?)(\S+)\s*\(([^)]+)\)(.*)$/);
  if (m) { v.add(m[1] + m[2] + m[4]); v.add(m[1] + m[3] + m[4]); v.add(m[3]); }
  return [...v].map(normA).filter(Boolean);
}
function lev(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
const cardF = c => (S && S.lang === 'de' && c.de) ? c.de[0] : c.front;
const cardB = c => (S && S.lang === 'de' && c.de) ? c.de[1] : c.back;
function speak(text) {
  try {
    const synth = window.speechSynthesis; if (!synth) throw 0;
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+[–-]\s+.*$/, '').replace(/[()]/g, ''));
    u.lang = 'en-GB'; u.rate = .9;
    const vs = synth.getVoices(), v = vs.find(x => x.lang === 'en-GB') || vs.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    synth.cancel(); synth.speak(u);
  } catch (e) { toast('Vorlesen wird auf diesem Gerät nicht unterstützt'); }
}
function judge(input, term) {
  const a = normA(input); if (!a) return 'wrong';
  const vs = variants(term);
  if (vs.includes(a)) return 'right';
  if (vs.some(v => lev(a, v) <= (v.length <= 5 ? 0 : v.length <= 10 ? 1 : 2))) return 'typo';
  return 'wrong';
}
function checkAnswer() {
  if (!S || S.busy || !S.write) return;
  if (S.checked) { if (S.dir === 'normal') rate(S.verdict); return; }
  const input = $('#ans').value.trim(), c = S.current;
  S.checked = true;
  const shown = input ? esc(input) : '<i>keine Antwort</i>';
  if (S.dir === 'normal') {
    const r = judge(input, cardB(c));
    S.verdict = r !== 'wrong';
    const txt = r === 'right' ? '✓ Richtig' : r === 'typo' ? '✓ Fast richtig – Schreibweise prüfen' : '✗ Leider falsch';
    $('#verdict').innerHTML = `<span class="v-text ${S.verdict ? 't-good' : 't-bad'}">${txt}</span><button type="button" class="btn" data-act="override">${S.verdict ? 'Doch falsch' : 'Doch gewusst'}</button>`;
    $('#cb').insertAdjacentHTML('beforeend', `<div class="your-answer ${r === 'right' ? 'ok' : r === 'wrong' ? 'no' : ''}">Deine Antwort: <b>${shown}</b></div>`);
    $('#ans-btn').textContent = 'Weiter';
  } else {
    $('#verdict').innerHTML = '<span class="v-text muted">Vergleiche selbst und bewerte dich.</span>';
    $('#cb').insertAdjacentHTML('beforeend', `<div class="your-answer">Deine Antwort: <b>${shown}</b></div>`);
    $('#ans').blur(); $('#answer').classList.add('hidden'); $('#rate').classList.remove('hidden');
  }
  S.flipped = true; S.revealed = true;
  $('#card').classList.add('flipped'); $('#rate').classList.remove('off');
}
/* Auswahl-Modus */
function renderMc(d, c) {
  const ans = x => S.dir === 'normal' ? cardB(x) : cardF(x);
  const right = ans(c), seen = new Set([normA(right)]);
  const pool = shuffle(d.cards.filter(x => x.id !== c.id)).map(ans).filter(a => { const k = normA(a); if (!k || seen.has(k)) return false; seen.add(k); return true; });
  S.mcOpts = shuffle([right, ...pool.slice(0, 3)]);
  S.mcRight = S.mcOpts.indexOf(right);
  $('#mc').innerHTML = S.mcOpts.map((o, i) => `<button data-act="mc" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o.length > 160 ? o.slice(0, 157) + '…' : o)}</span></button>`).join('');
}
function pickMc(i) {
  if (!S || S.busy || !S.mc || S.checked || i >= S.mcOpts.length) return;
  S.checked = true;
  const ok = i === S.mcRight, btns = [...$('#mc').querySelectorAll('button')], cur = S.current;
  btns.forEach((b, j) => { b.disabled = true; if (j === S.mcRight) b.classList.add('ok'); else if (j === i) b.classList.add('no'); });
  S.verdict = ok; S.flipped = true; S.revealed = true;
  $('#card').classList.add('flipped');
  if (ok) setTimeout(() => { if (S && S.current === cur) rate(true); }, 900);
  else $('#mc').insertAdjacentHTML('beforeend', '<button class="mc-next" data-act="mc-next">Weiter</button>');
}
function updateProgress() {
  $('#lp-fill').style.width = (S.done / S.total * 100) + '%';
  $('#lp-a').textContent = `${S.done} / ${S.total} geschafft`;
  const open = S.queue.filter(id => S.first.has(id)).length;
  $('#lp-b').textContent = open ? `${open} zur Wiederholung` : '';
}
function flip() {
  if (!S || S.busy) return;
  if (S.write && !S.checked) { $('#ans').focus(); return; }
  if (S.mc && !S.checked) return;
  S.flipped = !S.flipped;
  $('#card').classList.toggle('flipped', S.flipped);
  if (S.flipped && !S.revealed) { S.revealed = true; $('#rate').classList.remove('off'); }
}
function setHints(dx) {
  const g = $('#h-good'), b = $('#h-bad'); if (!g) return;
  g.style.opacity = dx > 0 ? Math.min(1, dx / 90) : 0;
  b.style.opacity = dx < 0 ? Math.min(1, -dx / 90) : 0;
}
function rate(known) {
  if (!S || S.busy || !S.revealed) return;
  S.busy = true;
  const c = S.current, first = !S.first.has(c.id);
  if (first) { S.first.set(c.id, known); if (logAnswer(known)) setTimeout(() => toast(`Tagesziel geschafft! 🔥 ${streakNow()} ${streakNow() === 1 ? 'Tag' : 'Tage'} am Stück`), 350); }
  S.queue.shift();
  if (known) {
    if (first) c.box = Math.min(5, c.box + 1);
    c.due = today0() + INTERVAL[c.box] * DAY;
    S.done++;
  } else {
    c.box = 1; c.due = 0; c.wrong = (c.wrong || 0) + 1;
    const pos = Math.min(S.queue.length, 3 + Math.floor(Math.random() * 3));
    S.queue.splice(pos, 0, c.id);
  }
  save();
  const dir = known ? 1 : -1, card = $('#card');
  setHints(dir * 200);
  card.style.transition = 'transform .32s ease-in, opacity .3s ease-in';
  card.style.transform = `translateX(${dir * 130}%) rotate(${dir * 16}deg)`;
  card.style.opacity = '0';
  setTimeout(showNext, 300);
}
function bindCard() {
  const card = $('#card'); let st = null;
  card.addEventListener('pointerdown', e => {
    if (!S || S.busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
    st = { x: e.clientX, y: e.clientY, dx: 0, moved: false, img: e.target.closest && e.target.closest('.card-img'), spk: e.target.closest && e.target.closest('.speak') };
    try { card.setPointerCapture(e.pointerId); } catch (_) {}
  });
  card.addEventListener('pointermove', e => {
    if (!st) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.moved && Math.hypot(dx, dy) > 10) { st.moved = true; card.style.transition = 'none'; }
    if (st.moved && S.revealed) { st.dx = dx; card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`; setHints(dx); }
  });
  const snap = () => { card.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; card.style.transform = ''; setHints(0); };
  card.addEventListener('pointerup', () => {
    if (!st) return; const s = st; st = null;
    if (!s.moved) { if (s.spk) { speak(s.spk.dataset.say); return; } if (s.img && S.flipped) { zoomImg(s.img.getAttribute('src')); return; } flip(); return; }
    if (S.revealed && Math.abs(s.dx) > 90) rate(s.dx > 0); else snap();
  });
  card.addEventListener('pointercancel', () => { st = null; snap(); });
}
function zoomImg(src) {
  openSheet(`<img class="zoom-img" src="${esc(src)}" alt="Bild zur Lösung"><div class="sheet-actions"><button class="btn primary" data-s="cancel">Schließen</button></div>`);
}
function finishSession() {
  const res = [...S.first.entries()], right = res.filter(([, k]) => k).length;
  ui.summary = { deckId: S.deckId, dir: S.dir, mode: S.mode, total: res.length, right, wrong: res.length - right,
    wrongIds: res.filter(([, k]) => !k).map(([id]) => id), complete: !S.queue.length };
  S = null; ui.sel = null; ui.view = 'summary'; render();
}

/* ---------- Events ---------- */
const actions = {
  home() { ui.view = 'home'; render(); },
  archive() { ui.view = 'archive'; render(); },
  'add-exam'() { editExam(ui.view === 'calendar' && ui.calSel ? { _new: true, name: '', date: ui.calSel, deckName: '' } : null); },
  calendar() { ui.view = 'calendar'; render(); },
  'cal-prev'() { calShift(-1); },
  'cal-next'() { calShift(1); },
  'cal-today'() { const t = new Date(); ui.calMonth = new Date(t.getFullYear(), t.getMonth(), 1); ui.calSel = ymd(t); render(); },
  'cal-day'(el) { ui.calSel = el.dataset.d; render(); },
  exam(el) { const e = db.exams.find(x => x.id === el.dataset.id); if (e) openExam(e); },
  settings() { ui.view = 'settings'; render(); },
  'show-install'() { ui.view = 'settings'; render(); const v = document.querySelector('.install-video'); if (v) { v.scrollIntoView({ block: 'start' }); v.play().catch(() => {}); } },
  'hide-install'() { db.settings.hideInstall = true; db.settings.hideInstallAt = Date.now(); save(); render(); },
  open(el) { ui.deckId = el.dataset.id; ui.sel = null; ui.search = ''; ui.view = 'deck'; render(); },
  'new-deck'() { askText('Neuer Stapel', 'z. B. LF2 – Leistungserstellung', '', 'Anlegen', name => {
    const d = makeDeck(name, []); db.decks.push(d); save(); ui.deckId = d.id; ui.sel = null; ui.search = ''; ui.view = 'deck'; render(); }); },
  'deck-menu'() { deckMenu(); },
  dir(el) { ui.dir = db.settings.dir = el.dataset.v; save(); render(); },
  lang(el) { const d = deck(); if (d) { d.lang = el.dataset.v; save(); render(); } },
  sel(el) { ui.sel = el.dataset.v; render(); },
  start() { const d = deck(), ids = selectCards(d, ui.sel).map(c => c.id); if (ids.length) startSession(d, ids, ui.dir, ui.mode); },
  mode(el) { ui.mode = db.settings.mode = el.dataset.v; save(); render(); },
  mc(el) { pickMc(+el.dataset.i); },
  'mc-next'() { if (S && S.checked) rate(S.verdict); },
  stats() { ui.view = 'stats'; render(); },
  goal(el) { db.settings.dailyGoal = +el.dataset.v; const e = db.log[dayKey()]; if (e) e.g = +el.dataset.v; save(); render(); },
  override() { if (S && S.checked) rate(!S.verdict); },
  'toggle-write'() {
    if (!S || S.busy) return;
    S.mode = ui.mode = db.settings.mode = S.write ? 'flip' : 'write'; S.write = S.mode === 'write'; S.mc = false; save();
    render(); showNext(); // aktuelle Karte im neuen Modus neu anzeigen
    toast(S.write ? 'Antwort eintippen: an' : 'Antwort eintippen: aus');
  },
  'add-card'() { editCard(deck(), null); },
  'edit-card'(el) { const d = deck(); editCard(d, d.cards.find(c => c.id === el.dataset.id)); },
  rate(el) { el.blur(); rate(el.dataset.v === '1'); },
  quit() { if (S && S.first.size) finishSession(); else { S = null; ui.view = 'deck'; render(); } },
  'retry-wrong'() { const s = ui.summary, d = deck(s.deckId); if (d) startSession(d, s.wrongIds, s.dir, s.mode); },
  'back-deck'() { ui.deckId = ui.summary ? ui.summary.deckId : ui.deckId; ui.view = deck() ? 'deck' : 'home'; render(); },
  theme(el) { db.settings.theme = el.dataset.v; save(); applyTheme(); render(); },
  'export-all'() { exportData(db.decks, 'karteikasten-backup-' + dateStr() + '.json', true); },
  'sync-start'() { syncStart(); },
  'sync-connect'() { syncConnect(); },
  'sync-show'() { showCode(false); },
  'sync-now'() { syncPull().then(() => syncPush()).then(() => toast('Synchronisiert')); },
  'sync-stop'() { syncStop(); },
  'backup-later'() { db.settings.backupSnooze = Date.now(); save(); render(); },
  'import-file'() { $('#file').click(); },
  'import-text'() { doImport($('#import-text').value, $('#replace').checked); },
  async 'copy-prompt'() {
    try { await navigator.clipboard.writeText(PROMPT); toast('Prompt kopiert'); }
    catch (e) { toast('Kopieren nicht möglich – bitte manuell markieren'); }
  },
};
$('#app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && !el.disabled && actions[el.dataset.act]) actions[el.dataset.act](el, e);
});
$('#app').addEventListener('input', e => {
  if (e.target.id === 'search') { ui.search = e.target.value; const d = deck(); if (d) $('#card-list').innerHTML = cardListHtml(d); }
});
$('#app').addEventListener('submit', e => { e.preventDefault(); checkAnswer(); });
$('#app').addEventListener('change', async e => {
  if (e.target.id === 'file' && e.target.files[0]) {
    const text = await e.target.files[0].text(); e.target.value = '';
    doImport(text, $('#replace').checked);
  }
});
document.addEventListener('keydown', e => {
  if (sheetEl) { if (e.key === 'Escape') closeSheet(); return; }
  if (ui.view !== 'learn' || !S || e.target.matches('input, textarea')) return;
  if (S.write && e.key === 'Enter') { e.preventDefault(); if (!S.checked || S.dir === 'normal') checkAnswer(); return; }
  if (S.mc) { if (/^[1-4]$/.test(e.key)) pickMc(+e.key - 1); else if (e.key === 'Enter' && S.checked) rate(S.verdict); else if (e.key === 'Escape') actions.quit(); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); S.revealed ? rate(true) : flip(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); S.revealed ? rate(false) : flip(); }
  else if (e.key === 'Escape') actions.quit();
});
window.addEventListener('storage', e => { if (e.key === KEY && ui.view !== 'learn') { db = load(); render(); } });

applyTheme();
render();
if (!db.settings.introSeen) showIntro();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW', err));
}
// ---------- Updates: beim Zurückkehren in die App nach neuer Version suchen ----------
var pageHash = null, updatePending = false, lastCheck = 0; // var: wird schon in render() abgefragt, bevor diese Zeile läuft
async function checkForUpdate() {
  if (!navigator.onLine || !location.protocol.startsWith('http')) return;
  lastCheck = Date.now();
  try {
    const res = await fetch('./index.html?check=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const h = hashStr(await res.text());
    if (pageHash === null) { pageHash = h; return; }
    if (h !== pageHash) { updatePending = true; applyUpdate(); }
  } catch (e) {}
  try { const reg = await navigator.serviceWorker?.getRegistration(); reg && reg.update(); } catch (e) {}
}
function applyUpdate() {
  if (!updatePending) return;
  if (ui.view === 'learn' || sheetEl) return; // nicht mitten in einer Lernrunde neu laden
  location.reload();
}
checkForUpdate();
syncPull();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') syncPull();
  else if (db.settings.syncDirty) syncPush(true);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastCheck > 15000) checkForUpdate();
});
setInterval(() => { if (document.visibilityState === 'visible') checkForUpdate(); }, 10 * 60 * 1000);
{
}
</script>
